apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard-home
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/andrewb76/agent-foundry.git'
    targetRevision: master    # или main — как у вас
    path: apps/00-network/adguard-home
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: adguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false