apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    # gRPC (argocd CLI) — приоритет выше, чтобы не перехватывался HTTP-роутом
    - kind: Rule
      match: Host(`argocd.ai.local`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
    # HTTP (UI)
    - kind: Rule
      match: Host(`argocd.ai.local`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
